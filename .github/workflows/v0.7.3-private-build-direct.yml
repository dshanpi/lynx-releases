name: Temporary v0.7.3 private-source direct build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lynx-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  OPENIXCLI_VERSION: 'v0.1.9'
  OPENIXCLI_COMMIT: '668d7b1678f8abbffdb4160da69da713cdc026c9'
  OPENROCKCLI_COMMIT: '71bdb75aeb0fb8d7be7160cc42ce8a9f35773b74'
  UUU_VERSION: '1.5.243'
  UUU_LINUX_SHA256: '7ed83eba9dce63cd4edc3a28bcc0cf4341de046d6316bde4885018773087ea24'
  UUU_WINDOWS_SHA256: 'f6b76a6246befabeadfebdc1cbfe58f35939596caf7b78717ceab599b0c85027'
  UUU_MACOS_ARM64_SHA256: '7f2ce10d5e738af635b339696709e2c3df4984801cc6c3764cd1c207c7aac9b0'
  DFU_UTIL_VERSION: '0.11'
  TAURI_DRIVER_VERSION: '2.0.6'
  DFU_UTIL_BINARIES_SHA256: '6450de30a7dcd8d8c1273f43f0b153f054fd24d85f7f38296b1ad8edbd2ddb25'
  RELEASE_REPOSITORY: 'dshanpi/lynx-releases'

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          repository: dshanpi/lynx
          ref: 5b053eb32e84f6bdfa6ff7abae87322d16357169
          submodules: recursive
          ssh-key: ${{ secrets.LYNX_SOURCE_DEPLOY_KEY }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            webkit2gtk-driver \
            xvfb \
            libappindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            libusb-1.0-0-dev \
            openssh-server \
            socat \
            patchelf \
            pkg-config

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Tauri desktop test driver
        run: cargo install tauri-driver --version "${TAURI_DRIVER_VERSION}" --locked

      - name: Validate release version
        run: npm run validate:release -- v0.7.3

      - name: Type-check frontend
        run: npm run typecheck

      - name: Lint frontend
        run: npm run lint

      - name: Prepare platform resource placeholders
        run: |
          mkdir -p \
            src-tauri/resources/runtime/linux-x86_64/pyembed \
            src-tauri/resources/runtime/linux-x86_64/openocd \
            src-tauri/resources/runtime/linux-x86_64/cmsis-packs \
            src-tauri/resources/binaries
          touch \
            src-tauri/resources/runtime/linux-x86_64/pyembed/.validation-placeholder \
            src-tauri/resources/binaries/openixcli \
            src-tauri/resources/binaries/openrockcli \
            src-tauri/resources/binaries/uuu \
            src-tauri/resources/binaries/dfu-util \
            src-tauri/resources/binaries/libusb-1.0.so.0

      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Simulate visible business logic in isolated Tauri desktop
        run: npm run gate:business-logic-ui

      - name: Upload business logic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-logic-gate-linux
          path: artifacts/business-logic-gate/linux
          if-no-files-found: error

      - name: Verify real isolated SSH terminal lifecycle
        run: LYNX_SSH_RUNTIME_SKIP_BUILD=1 npm run gate:ssh-terminal-runtime

      - name: Upload SSH terminal runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssh-terminal-runtime-gate-linux
          path: artifacts/ssh-terminal-gate/linux
          if-no-files-found: error

      - name: Verify AI supervisor unified runtime with pseudo serial
        run: LYNX_AI_RUNTIME_SKIP_BUILD=1 npm run gate:ai-supervisor-runtime

      - name: Upload AI supervisor runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-supervisor-runtime-gate-linux
          path: artifacts/ai-supervisor-runtime-gate/linux
          if-no-files-found: error

      - name: Enforce startup screenshot gate
        run: LYNX_VISUAL_SKIP_BUILD=1 xvfb-run -a npm run gate:startup-visual

      - name: Upload startup screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-visual-gate-linux
          path: artifacts/visual-gate/startup/linux
          if-no-files-found: error

      - name: Test Python SDK
        run: python3 -m unittest discover -s python/tests -v

  build:
    name: Build ${{ matrix.name }}
    if: github.event_name != 'pull_request'
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows
            os: windows-latest
            runtime: windows-x86_64
            bundles: nsis
          - name: Linux x64
            platform: linux
            os: ubuntu-22.04
            runtime: linux-x86_64
            bundles: appimage
          - name: macOS arm64
            platform: macos
            os: macos-14
            runtime: darwin-aarch64
            bundles: dmg
    runs-on: ${{ matrix.os }}
    env:
      LYNX_RUNTIME_TARGET: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: dshanpi/lynx
          ref: 5b053eb32e84f6bdfa6ff7abae87322d16357169
          submodules: recursive
          ssh-key: ${{ secrets.LYNX_SOURCE_DEPLOY_KEY }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install Windows OpenRockCLI toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libusb
            pkgconf

      - name: Prefer complete Windows Perl for OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perlBin = 'C:\Strawberry\perl\bin'
          $perl = Join-Path $perlBin 'perl.exe'
          if (-not (Test-Path $perl)) {
            throw "Required Strawberry Perl was not found at $perl"
          }
          & $perl -MLocale::Maketext::Simple -e 1
          if ($LASTEXITCODE -ne 0) {
            throw 'Strawberry Perl is missing Locale::Maketext::Simple'
          }

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            libusb-1.0-0-dev \
            patchelf \
            pkg-config \
            rpm \
            xdg-utils

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install dfu-util libusb openssl@3 pkg-config tinyxml2 zstd

      - name: Install frontend dependencies
        run: npm ci

      - name: Build OpenixCLI
        shell: bash
        run: |
          git clone --depth 1 --branch "$OPENIXCLI_VERSION" \
            https://github.com/YuzukiTsuru/OpenixCLI.git openixcli
          test "$(git -C openixcli rev-parse HEAD)" = "$OPENIXCLI_COMMIT"
          git -C openixcli apply \
            "$GITHUB_WORKSPACE/scripts/patches/openixcli-v0.1.9-lynx.patch"
          libefex_patch="patch.\"https://github.com/YuzukiTsuru/libefex\".libefex.path=\"$GITHUB_WORKSPACE/src-tauri/libs/libefex/rust/libefex\""
          cargo test --manifest-path openixcli/Cargo.toml --config "$libefex_patch"
          cargo build --release --manifest-path openixcli/Cargo.toml --config "$libefex_patch"
          mkdir -p src-tauri/resources/binaries

      - name: Bundle Windows OpenixCLI dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p src-tauri/resources/windows
          cp openixcli/target/release/openixcli.exe \
            src-tauri/resources/binaries/openixcli.exe
          libusb="$(find openixcli/target/release -name 'libusb-1.0.dll' -print -quit)"
          test -n "$libusb"
          cp "$libusb" src-tauri/resources/binaries/libusb-1.0.dll
          cp "$libusb" src-tauri/resources/windows/libusb-1.0.dll

      - name: Bundle Linux OpenixCLI dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cp openixcli/target/release/openixcli \
            src-tauri/resources/binaries/openixcli
          chmod +x src-tauri/resources/binaries/openixcli
          libusb="$(ldd openixcli/target/release/openixcli | awk '/libusb-1.0.so/{print $3; exit}')"
          test -f "$libusb"
          cp -L "$libusb" src-tauri/resources/binaries/libusb-1.0.so.0
          patchelf --set-rpath '$ORIGIN' src-tauri/resources/binaries/openixcli

      - name: Bundle macOS OpenixCLI dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cp openixcli/target/release/openixcli \
            src-tauri/resources/binaries/openixcli
          chmod +x src-tauri/resources/binaries/openixcli
          libusb="$(otool -L openixcli/target/release/openixcli | awk '/libusb/{print $1; exit}')"
          test -f "$libusb"
          cp -L "$libusb" src-tauri/resources/binaries/libusb-1.0.dylib
          install_name_tool -id '@loader_path/libusb-1.0.dylib' \
            src-tauri/resources/binaries/libusb-1.0.dylib
          install_name_tool -change "$libusb" '@loader_path/libusb-1.0.dylib' \
            src-tauri/resources/binaries/openixcli

      - name: Build OpenRockCLI
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git clone https://github.com/dshanpi/openrockcli.git openrockcli-rk
          git -C openrockcli-rk checkout "$OPENROCKCLI_COMMIT"
          test "$(git -C openrockcli-rk rev-parse HEAD)" = "$OPENROCKCLI_COMMIT"
          make -C openrockcli-rk
          strip openrockcli-rk/openrockcli
          openrockcli-rk/openrockcli --version

      - name: Build Windows OpenRockCLI
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          git clone https://github.com/dshanpi/openrockcli.git openrockcli-rk
          git -C openrockcli-rk checkout "$OPENROCKCLI_COMMIT"
          test "$(git -C openrockcli-rk rev-parse HEAD)" = "$OPENROCKCLI_COMMIT"
          make -C openrockcli-rk NAME=openrockcli.exe
          strip openrockcli-rk/openrockcli.exe
          openrockcli-rk/openrockcli.exe --version

      - name: Bundle Windows OpenRockCLI
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cp openrockcli-rk/openrockcli.exe src-tauri/resources/binaries/openrockcli.exe
          ldd openrockcli-rk/openrockcli.exe |
            awk '/ucrt64/ { print $3 }' |
            sort -u |
            while read -r dll; do
              name="$(basename "$dll")"
              test -f "src-tauri/resources/binaries/$name" ||
                cp "$dll" "src-tauri/resources/binaries/$name"
            done

      - name: Bundle Linux OpenRockCLI
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cp openrockcli-rk/openrockcli src-tauri/resources/binaries/openrockcli
          chmod +x src-tauri/resources/binaries/openrockcli
          patchelf --set-rpath '$ORIGIN' src-tauri/resources/binaries/openrockcli

      - name: Bundle macOS OpenRockCLI
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cp openrockcli-rk/openrockcli src-tauri/resources/binaries/openrockcli
          chmod +x src-tauri/resources/binaries/openrockcli
          libusb="$(otool -L openrockcli-rk/openrockcli | awk '/libusb/{print $1; exit}')"
          install_name_tool -change "$libusb" '@loader_path/libusb-1.0.dylib' \
            src-tauri/resources/binaries/openrockcli

      - name: Bundle NXP UUU
        shell: bash
        run: |
          base_url="https://github.com/nxp-imx/mfgtools/releases/download/uuu_${UUU_VERSION}"
          case "${{ runner.os }}" in
            Windows)
              asset="uuu.exe"
              target="src-tauri/resources/binaries/uuu.exe"
              expected="$UUU_WINDOWS_SHA256"
              ;;
            Linux)
              asset="uuu"
              target="src-tauri/resources/binaries/uuu"
              expected="$UUU_LINUX_SHA256"
              ;;
            macOS)
              asset="uuu_mac_arm"
              target="src-tauri/resources/binaries/uuu"
              expected="$UUU_MACOS_ARM64_SHA256"
              ;;
          esac
          curl --fail --location --retry 3 \
            "$base_url/$asset" --output "$target"
          actual="$(node -e \
            "const fs=require('fs'),c=require('crypto');process.stdout.write(c.createHash('sha256').update(fs.readFileSync(process.argv[1])).digest('hex'))" \
            "$target")"
          test "$actual" = "$expected"
          if [ "${{ runner.os }}" != "Windows" ]; then
            chmod +x "$target"
          fi
          if [ "${{ runner.os }}" = "Linux" ]; then
            patchelf --set-rpath '$ORIGIN' "$target"
          fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            uuu_libusb="$(otool -L "$target" | awk '/libusb/{print $1; exit}')"
            test -f "$uuu_libusb"
            install_name_tool -change "$uuu_libusb" '@loader_path/libusb-1.0.dylib' "$target"
            otool -L "$target" |
              awk 'index($0, "/opt/homebrew/") && !/libusb/ {print $1}' |
              while read -r dependency; do
                name="$(basename "$dependency")"
                test -f "$dependency"
                cp -L "$dependency" "src-tauri/resources/binaries/$name"
                install_name_tool -id "@loader_path/$name" \
                  "src-tauri/resources/binaries/$name"
                install_name_tool -change "$dependency" "@loader_path/$name" "$target"
              done
            for dylib in src-tauri/resources/binaries/*.dylib; do
              otool -L "$dylib" |
                awk 'index($0, "/opt/homebrew/") {print $1}' |
                while read -r dependency; do
                  name="$(basename "$dependency")"
                  if [ -f "src-tauri/resources/binaries/$name" ]; then
                    install_name_tool -change "$dependency" "@loader_path/$name" "$dylib"
                  fi
                done
            done
          fi

      - name: Bundle STM32 dfu-util
        shell: bash
        run: |
          runtime_temp="$RUNNER_TEMP"
          if [ "${{ runner.os }}" = "Windows" ]; then
            runtime_temp="$(cygpath -u "$RUNNER_TEMP")"
          fi
          archive="$runtime_temp/dfu-util-${DFU_UTIL_VERSION}-binaries.tar.xz"
          curl --fail --location --retry 3 \
            "https://dfu-util.sourceforge.net/releases/dfu-util-${DFU_UTIL_VERSION}-binaries.tar.xz" \
            --output "$archive"
          actual="$(node -e \
            "const fs=require('fs'),c=require('crypto');process.stdout.write(c.createHash('sha256').update(fs.readFileSync(process.argv[1])).digest('hex'))" \
            "$archive")"
          test "$actual" = "$DFU_UTIL_BINARIES_SHA256"
          tar -xJf "$archive" -C "$runtime_temp"
          root="$runtime_temp/dfu-util-${DFU_UTIL_VERSION}-binaries"
          cp "$root/COPYING" src-tauri/resources/binaries/dfu-util-COPYING
          case "${{ runner.os }}" in
            Windows)
              cp "$root/win64/dfu-util-static.exe" \
                src-tauri/resources/binaries/dfu-util.exe
              ;;
            Linux)
              cp "$root/linux-amd64/dfu-util-static" \
                src-tauri/resources/binaries/dfu-util
              chmod +x src-tauri/resources/binaries/dfu-util
              ;;
            macOS)
              cp "$(brew --prefix dfu-util)/bin/dfu-util" \
                src-tauri/resources/binaries/dfu-util
              chmod +x src-tauri/resources/binaries/dfu-util
              dfu_libusb="$(otool -L src-tauri/resources/binaries/dfu-util | awk '/libusb/{print $1; exit}')"
              test -n "$dfu_libusb"
              install_name_tool -change "$dfu_libusb" '@loader_path/libusb-1.0.dylib' \
                src-tauri/resources/binaries/dfu-util
              ;;
          esac

      - name: Verify embedded tools
        shell: bash
        run: |
          node scripts/fetch-python-runtime.mjs --target="${{ matrix.runtime }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            src-tauri/resources/binaries/openixcli.exe --version
            src-tauri/resources/binaries/openrockcli.exe --version
            src-tauri/resources/binaries/uuu.exe -h > /dev/null
            src-tauri/resources/binaries/dfu-util.exe --version
            src-tauri/resources/runtime/${{ matrix.runtime }}/pyembed/python.exe \
              -c "import multiprocessing, sqlite3, ssl"
          else
            src-tauri/resources/binaries/openixcli --version
            src-tauri/resources/binaries/openrockcli --version
            src-tauri/resources/binaries/uuu -h > /dev/null
            src-tauri/resources/binaries/dfu-util --version
            src-tauri/resources/runtime/${{ matrix.runtime }}/pyembed/bin/python3 \
              -c "import multiprocessing, sqlite3, ssl"
          fi

      - name: Require updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"

      - name: Build unsigned installers
        if: ${{ false }}
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            export PATH="/c/Strawberry/perl/bin:$PATH"
            perl -MLocale::Maketext::Simple -e 1
          fi
          if [ "${{ runner.os }}" != "Windows" ]; then
            chmod -R a+rX src-tauri/resources
          fi
          npm run tauri build -- --ci --no-sign --bundles ${{ matrix.bundles }}

      - name: Build signed updater installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            export PATH="/c/Strawberry/perl/bin:$PATH"
            perl -MLocale::Maketext::Simple -e 1
          fi
          if [ "${{ runner.os }}" != "Windows" ]; then
            chmod -R a+rX src-tauri/resources
          fi
          npm run tauri build -- --ci --bundles ${{ matrix.bundles }}

      - name: Build Linux DEB and RPM with collision-free package identity
        if: runner.os == 'Linux'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          signing=--no-sign
          if true; then
            signing=
          fi
          npm run tauri build -- --ci $signing --bundles deb,rpm \
            --config src-tauri/tauri.linux-package.conf.json

      - name: Install, launch and upgrade Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $oldInstaller = Join-Path $env:RUNNER_TEMP 'LYNX_0.5.0_x64-setup.exe'
          Invoke-WebRequest `
            'https://github.com/dshanpi/lynx-releases/releases/download/v0.5.0/LYNX_0.5.0_x64-setup.exe' `
            -OutFile $oldInstaller
          $currentInstaller = Get-ChildItem `
            'src-tauri/target/release/bundle/nsis/*-setup.exe' |
            Select-Object -First 1
          if (-not $currentInstaller) {
            throw 'Current NSIS installer was not produced.'
          }

          Start-Process -FilePath $oldInstaller -ArgumentList '/S' -Wait
          $productKey = 'HKCU:\Software\DshanPI\LYNX'
          $oldDir = (Get-ItemProperty -Path $productKey).'(default)'
          if (-not (Test-Path (Join-Path $oldDir 'lynx-app.exe'))) {
            throw "v0.5.0 application was not installed at $oldDir"
          }
          $oldProcess = Start-Process `
            -FilePath (Join-Path $oldDir 'lynx-app.exe') -PassThru
          Start-Sleep -Seconds 5

          Start-Process -FilePath $currentInstaller.FullName `
            -ArgumentList @('/S', '/UPDATE') -Wait
          $newDir = (Get-ItemProperty -Path $productKey).'(default)'
          $expectedVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ($newDir -notmatch "app-$([regex]::Escape($expectedVersion))-\d+$") {
            throw "Versioned install directory was not selected: $newDir"
          }
          if ($newDir -eq $oldDir) {
            throw 'Upgrade reused the old program directory.'
          }
          if (-not $oldProcess.HasExited) {
            Stop-Process -Id $oldProcess.Id -Force -ErrorAction SilentlyContinue
            throw 'Upgrade did not stop the previous LYNX process.'
          }
          $displayVersion = (Get-ItemProperty `
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\LYNX').DisplayVersion
          if ($displayVersion -ne $expectedVersion) {
            throw "Installed version is $displayVersion, expected $expectedVersion"
          }

          $newProcess = Start-Process `
            -FilePath (Join-Path $newDir 'lynx-app.exe') -PassThru
          Start-Sleep -Seconds 10
          if ($newProcess.HasExited) {
            throw "Installed LYNX exited early with $($newProcess.ExitCode)."
          }
          Stop-Process -Id $newProcess.Id -Force
          Start-Process -FilePath (Join-Path $newDir 'uninstall.exe') `
            -ArgumentList '/S' -Wait
          if (Test-Path (Join-Path $newDir 'lynx-app.exe')) {
            throw 'Windows uninstall left the application executable behind.'
          }

      - name: Install, launch and upgrade Linux DEB
        if: runner.os == 'Linux'
        shell: bash
        run: |
          old_deb="$RUNNER_TEMP/LYNX_0.5.0_amd64.deb"
          curl --fail --location --retry 3 \
            'https://github.com/dshanpi/lynx-releases/releases/download/v0.5.0/LYNX_0.5.0_amd64.deb' \
            --output "$old_deb"
          current_deb="$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)"
          current_rpm="$(find src-tauri/target/release/bundle/rpm -name '*.rpm' -print -quit)"
          test -n "$current_deb"
          test -n "$current_rpm"
          package_name="$(dpkg-deb -f "$current_deb" Package)"
          test "$package_name" = 'dshan-pi-lynx'
          test "$(rpm -qp --queryformat '%{NAME}' "$current_rpm")" = 'dshan-pi-lynx'
          expected_version="$(node -p "require('./package.json').version")"

          sudo dpkg -i "$old_deb"
          test "$(dpkg-query -W -f='${Version}' lynx)" = '0.5.0'
          old_application="$(dpkg -L lynx | awk '/\/usr\/bin\// {print; exit}')"
          test -x "$old_application"
          sudo dpkg -r lynx
          ! dpkg-query -W lynx > /dev/null 2>&1

          sudo dpkg -i "$current_deb"
          test "$(dpkg-query -W -f='${Version}' "$package_name")" = "$expected_version"
          sudo apt-get install -y lynx
          test -x /usr/bin/lynx
          test "$(dpkg-query -W -f='${Version}' dshan-pi-lynx)" = "$expected_version"
          application="$(dpkg -L "$package_name" | awk '/\/usr\/bin\// {print; exit}')"
          test -x "$application"
          smoke_data="$RUNNER_TEMP/lynx-installed-smoke"
          mkdir -p "$smoke_data/data" "$smoke_data/config" "$smoke_data/cache"
          XDG_DATA_HOME="$smoke_data/data" \
            XDG_CONFIG_HOME="$smoke_data/config" \
            XDG_CACHE_HOME="$smoke_data/cache" \
            xvfb-run -a bash -c '
              "$1" >"$2" 2>&1 &
              app_pid=$!
              sleep 10
              kill -0 "$app_pid"
              kill -TERM "$app_pid"
              wait "$app_pid" || true
            ' _ "$application" "$smoke_data/runtime.log"
          ! grep -Eqi 'panic|unhandled exception' "$smoke_data/runtime.log"
          sudo dpkg -r "$package_name"
          ! dpkg-query -W "$package_name" > /dev/null 2>&1

      - name: Install, launch and remove macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg="$(find src-tauri/target/release/bundle/dmg -name '*.dmg' -print -quit)"
          test -n "$dmg"
          mount_point="$RUNNER_TEMP/lynx-dmg"
          install_root="$RUNNER_TEMP/lynx-applications"
          mkdir -p "$mount_point" "$install_root"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_point"
          source_app="$(find "$mount_point" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$source_app"
          ditto "$source_app" "$install_root/LYNX.app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' \
            "$install_root/LYNX.app/Contents/Info.plist")"
          "$install_root/LYNX.app/Contents/MacOS/$executable" \
            > "$RUNNER_TEMP/lynx-macos-runtime.log" 2>&1 &
          app_pid=$!
          sleep 10
          kill -0 "$app_pid"
          kill -TERM "$app_pid"
          wait "$app_pid" || true
          ! grep -Eqi 'panic|unhandled exception' "$RUNNER_TEMP/lynx-macos-runtime.log"
          rm -rf "$install_root/LYNX.app"
          hdiutil detach "$mount_point"
          test ! -e "$install_root/LYNX.app"

      - name: Verify Windows installer runtime dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: |
          installer="$(find src-tauri/target/release/bundle/nsis \
            -name '*-setup.exe' -print -quit)"
          test -n "$installer"
          mkdir installer-contents
          7z x "$installer" -oinstaller-contents
          test -f installer-contents/libusb-1.0.dll
          test -f installer-contents/bin/libusb-1.0.dll
          test -f installer-contents/bin/openixcli.exe
          test -f installer-contents/bin/openrockcli.exe
          test -f installer-contents/bin/uuu.exe
          test -f installer-contents/bin/dfu-util.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.platform }}
          retention-days: 1
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe*
            src-tauri/target/release/bundle/appimage/*.AppImage*
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz*

  publish:
    name: Publish release
    if: ${{ false }}
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          repository: dshanpi/lynx
          ref: ${{ github.ref }}
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enforce closed-source release boundary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LYNX_RELEASE_TOKEN }}
        run: |
          test "${{ github.event.repository.private }}" = "true"
          test "$GITHUB_REPOSITORY" != "$RELEASE_REPOSITORY"
          test "$RELEASE_REPOSITORY" = "dshanpi/lynx-releases"
          test "$(gh api "repos/$RELEASE_REPOSITORY" --jq .visibility)" = "public"
          unexpected="$(gh api "repos/$RELEASE_REPOSITORY/git/trees/main?recursive=1" \
            --jq '[.tree[].path | select(. != "README.md")] | join("\n")')"
          if [ -n "$unexpected" ]; then
            echo "Public release repository contains files other than README.md:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Download platform artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-input

      - name: Prepare updater manifest and checksums
        run: |
          node scripts/prepare-release-assets.mjs \
            release-input release-output "$RELEASE_REPOSITORY" "${{ github.ref_name }}" \
            windows,linux,macos "docs/releases/${{ github.ref_name }}.md"

      - name: Reject source-like release assets
        shell: bash
        run: |
          if find release-output -maxdepth 1 -type f \
            ! -name '*.exe' ! -name '*.exe.sig' \
            ! -name '*.msi' ! -name '*.msi.sig' \
            ! -name '*.AppImage' ! -name '*.AppImage.sig' \
            ! -name '*.deb' ! -name '*.rpm' ! -name '*.dmg' \
            ! -name '*.app.tar.gz' ! -name '*.app.tar.gz.sig' \
            ! -name 'latest.json' ! -name 'SHA256SUMS.txt' | grep -q .; then
            echo "Release output contains a forbidden source-like asset." >&2
            exit 1
          fi

      - name: Create or reuse release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LYNX_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -n "$GH_TOKEN"
          if ! gh release view "$RELEASE_TAG" \
            --repo "$RELEASE_REPOSITORY" > /dev/null 2>&1; then
            if [ -f "docs/releases/$RELEASE_TAG.md" ]; then
              cp "docs/releases/$RELEASE_TAG.md" release-notes.md
            else
              echo "DshanPI LYNX｜芯桥 $RELEASE_TAG" > release-notes.md
            fi
            gh release create "$RELEASE_TAG" \
              --repo "$RELEASE_REPOSITORY" \
              --target main \
              --title "DshanPI LYNX｜芯桥 $RELEASE_TAG" \
              --notes-file release-notes.md \
              ${{ contains(github.ref_name, '-') && '--prerelease' || '' }} \
              --draft
          fi

      - name: Upload and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LYNX_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" release-output/* \
            --repo "$RELEASE_REPOSITORY" \
            --clobber
          expected="$(find release-output -maxdepth 1 -type f | wc -l | tr -d ' ')"
          actual="$(gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" \
            --json assets --jq '.assets | length')"
          test "$actual" -ge "$expected"
          # v0.7.0 remains a public pre-release until the Windows install,
          # overwrite-upgrade and applicable HIL gates have user evidence.
          if [[ "$RELEASE_TAG" == *-* || "$RELEASE_TAG" == "v0.7.0" ]]; then
            gh release edit "$RELEASE_TAG" \
              --repo "$RELEASE_REPOSITORY" \
              --draft=false \
              --prerelease=true
          else
            gh release edit "$RELEASE_TAG" \
              --repo "$RELEASE_REPOSITORY" \
              --draft=false \
              --prerelease=false \
              --latest
          fi
